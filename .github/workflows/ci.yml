name: CPU unit and API contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy<3' pillow pyyaml httpx fastapi opencv-python-headless
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Run unit and HTTP contract tests
        run: python -m unittest discover -s tests -v
